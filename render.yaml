services:
  - type: web
    name: sans-calque
    runtime: python
    plan: standard
    buildCommand: pip install -r requirements-app.txt
    startCommand: uvicorn app.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TINKER_API_KEY
        sync: false
      - key: DAILY_WORDS
        value: "20000"
